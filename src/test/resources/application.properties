# ??? Test datasource (H2 in-memory, replaced automatically by @DataJpaTest) ??????
# @DataJpaTest replaces the datasource with an embedded H2 instance.
# We still need to override the dialect so Hibernate generates H2-compatible DDL
# instead of PostgreSQL DDL.  Without this, Hibernate emits PostgreSQL-style
# IN-clause check constraints that crash H2 2.4.x during schema creation
# (H2 bug: ConditionInConstantSet calls SessionLocal.compare() after the DB
# has already been closed during DDL flush ? SQLState 23514 / 90098).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress SQL noise in test output (flip to true if you need to debug a query)
spring.jpa.show-sql=false

# Silence the "PostgreSQLDialect is no longer supported" warning ? not relevant
# for tests because we are no longer using it here.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ??? Stub out external services so @DataJpaTest context loads without them ???????
