<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            background-color: #ffffff;
            width: 80%;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #0044cc;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .content {
            padding: 20px;
            color: #333333;
            line-height: 1.6;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 th:text="${title}">Notification Title</h2>
    </div>
    <div class="content">
        <p>Hello <strong th:text="${userName}">User</strong>,</p>
        <p th:text="${message}">This is a notification message.</p>
        <p>Regards,<br>Loan Management System Team</p>
    </div>
    <div class="footer">
        &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}"></span> Loan Management System. All rights reserved.<br>
        Please do not reply to this automated email.
    </div>
</div>
</body>
</html>
